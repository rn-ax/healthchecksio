name: "Sync upstream"

# Opens a PR merging custom-components/healthchecksio's main branch into this
# fork's main, weekly or on demand. Never pushes to main directly and never
# force-resets it -- a human reviews and merges the PR like any other, so a
# conflict with our _rn_ax.py-isolated changes surfaces for review instead of
# silently overwriting them. See the README's "About this fork" note for why
# this fork exists and when to drop it in favor of upstream again.

on:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@v6.0.2"
        with:
          fetch-depth: 0

      - name: "Merge upstream/main into a sync branch"
        id: merge
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/custom-components/healthchecksio.git
          git fetch upstream main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date with upstream, nothing to do."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BRANCH="sync-upstream"
          git checkout -B "$BRANCH"
          if git merge upstream/main --no-edit; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            git add -A
            git commit -m "Merge upstream/main (has conflicts, needs manual resolution)" --no-verify
            echo "conflict=true" >> "$GITHUB_OUTPUT"
          fi
          git push origin "$BRANCH" --force
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: "Open (or update) the sync PR"
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ steps.merge.outputs.conflict }}" = "true" ]; then
            BODY="Automated merge of upstream/main -- **has conflicts**, needs manual resolution before this can merge."
          else
            BODY="Automated merge of upstream/main. Our fork-specific changes live in _rn_ax.py and its call sites in config_flow.py/coordinator.py -- review that those call sites still make sense against whatever upstream changed."
          fi
          gh pr create \
            --title "Sync with upstream custom-components/healthchecksio" \
            --body "$BODY" \
            --base main \
            --head "${{ steps.merge.outputs.branch }}" \
            || echo "PR already exists for this branch, force-push above already updated it."
